name: CI

on:
  push:
    branches: [main, version-16]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: bash -n .github/helper/install.sh
      - run: git ls-files '*.json' -z | xargs -0 -n1 python -m json.tool >/dev/null

  server-tests:
    name: Frappe v16 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -proot"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
    env:
      APP_NAME: za_local_core
      FRAPPE_BRANCH: version-16
      ERPNEXT_BRANCH: version-16
      HRMS_BRANCH: version-16
      ZA_LOCAL_CORE_REF: main
      ZA_LOCAL_PAYROLL_REF: main
      # Read access to the sibling private localisation repositories.
      ZA_LOCAL_CI_TOKEN: ${{ secrets.ZA_LOCAL_CI_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Add test host
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
      - name: Install bench and application stack
        run: bash .github/helper/install.sh
      - name: Run server tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app "$APP_NAME" --lightmode
      - name: Verify legacy app is absent
        working-directory: /home/runner/frappe-bench
        run: '! bench --site test_site list-apps | grep -Fx za_local'
