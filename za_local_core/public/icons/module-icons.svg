<!-- Dual-tone module icons for the desk dock and sidebar headers, in the Frappe v16 convention.
     Each symbol fills from the duotone-light and duotone-dark custom properties (set by the dock
     tile and the sidebar header; the fallbacks are the resting tones) and moves only while its dock
     tile is hovered, through the icon-motion properties. Frappe's own sprite holds the tone rules.

     Registered in hooks.py under app_include_icons. Names end in -duotone so the dock styles them. -->

<svg id="za-local-core-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		@media (prefers-reduced-motion: no-preference) {
			.za-check-draw {
				transform-box: view-box;
				transform-origin: 12px 12px;
				transform: scale(calc(1 + 0.14 * var(--icon-motion-opacity, 0)));
				transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
			}
			.za-receipt-lines {
				transform: translateY(calc(var(--icon-motion-opacity, 0) * -1px));
				transition: transform 0.3s ease;
			}
		}

	</style>

	<!-- SA Overview: compliance shield with a check -->
	<symbol viewBox="0 0 24 24" id="icon-za-shield-check-duotone" stroke="none">
		<path d="M12 1.8L20.5 5.3V11.2C20.5 16.3 16.9 19.9 12 22.2C7.1 19.9 3.5 16.3 3.5 11.2V5.3Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path class="za-check-draw" d="M8.2 11.8L10.9 14.5L15.9 9.4" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="stroke: var(--duotone-light, var(--ink-gray-3))" />
	</symbol>

	<!-- SA VAT: a tax receipt -->
	<symbol viewBox="0 0 24 24" id="icon-za-receipt-duotone" stroke="none">
		<path d="M4.5 2.5H19.5V21.5L17 19.8L14.5 21.5L12 19.8L9.5 21.5L7 19.8L4.5 21.5Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<g class="za-receipt-lines">
			<rect x="7.5" y="6.5" width="9" height="1.8" rx="0.9" style="fill: var(--duotone-light, var(--ink-gray-3))" />
			<rect x="7.5" y="10.4" width="9" height="1.8" rx="0.9" style="fill: var(--duotone-light, var(--ink-gray-3))" />
			<rect x="7.5" y="14.3" width="5.5" height="1.8" rx="0.9" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		</g>
	</symbol>
</svg>
